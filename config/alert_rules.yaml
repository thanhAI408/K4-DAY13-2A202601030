alerts:
  - name: api_latency_slo_breach
    severity: critical
    condition: p95(response_sent.latency_ms) > 3000 for 5m
    type: symptom-based
    owner: SRE
    runbook: docs/alerts.md#alert-1
  - name: api_error_rate_slo_breach
    severity: critical
    condition: error_rate_pct > 2 for 5m
    type: symptom-based
    owner: API/SRE
    runbook: docs/alerts.md#alert-2
  - name: api_daily_cost_budget_breach
    severity: warning
    condition: sum(response_sent.cost_usd) > 2.5 in rolling 24h
    type: symptom-based
    owner: FinOps/SRE
    runbook: docs/alerts.md#alert-3
